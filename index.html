<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Economics — ECOTOPIA</title>
<meta name="description" content="International Economics course page: slides, data exercises and course materials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<!-- ==========================================================================
     TOUT CE QUI SE MODIFIE SE TROUVE DANS LE BLOC DE CODE EN BAS DE CE FICHIER.
     Il n'est pas nécessaire de toucher au HTML ni au CSS pour faire vivre le cours.
     ========================================================================== -->

<style>
  :root{
    /* Charte graphique CY Cergy Paris Université (mars 2021)
       Pantone 446 #3D4543 · Pantone 305 #54C9E8 · Pantone 102 #FFE700
       Pantone 369 #65B32E (couleur de fusion) · Pantone 485 #E2162F */
    --cy-446:#3D4543;
    --cy-bleu:#54C9E8;
    --cy-jaune:#FFE700;
    --cy-vert:#65B32E;

    --paper:#F1F3F3;
    --card:#FFFFFF;
    --ink:#3D4543;
    --ink-soft:#6E7574;
    --rule:#D7DBDA;
    --now:#65B32E;
    --now-wash:#EFF7E7;
    --due:#E2162F;
    --due-wash:#FCEAEC;

    --sans:"Archivo",system-ui,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;

    --gap:clamp(1.25rem,3vw,2rem);
    --rail:2px;
  }

  *,*::before,*::after{box-sizing:border-box}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:clamp(1rem,0.97rem + 0.15vw,1.0625rem);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:64rem;margin:0 auto;padding:0 var(--gap)}

  a{color:inherit}
  a:focus-visible,button:focus-visible{
    outline:2px solid var(--now);
    outline-offset:3px;
    border-radius:2px;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:0.7rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---------- en-tête ---------- */
  .masthead{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(1.5rem,3vw,2.5rem)}

  .masthead h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(2rem,1.3rem + 3.4vw,3.5rem);
    letter-spacing:-0.032em;
    line-height:1.02;
    margin:0.55rem 0 0;
    max-width:20ch;
  }

  .facts{
    display:flex;
    flex-wrap:wrap;
    gap:0.4rem 2rem;
    margin:1.5rem 0 0;
    padding:0;
    list-style:none;
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .facts b{
    display:block;
    font-weight:500;
    font-size:0.66rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.45;
    margin-bottom:0.15rem;
  }

  /* ---------- bandeau de situation ---------- */
  .status{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--now);
    padding:1.15rem 1.35rem;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:0.35rem 1.5rem;
  }
  .status.is-pre{border-left-color:var(--ink-soft)}
  .status.is-exam{border-left-color:var(--due)}
  .status-main{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:-0.01em;
    margin:0;
  }
  .status-sub{margin:0;color:var(--ink-soft);font-size:0.95rem}

  /* ---------- sections ---------- */
  section{padding:clamp(2.75rem,6vw,4.25rem) 0}
  section + section{border-top:1px solid var(--rule)}

  h2{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:-0.02em;
    margin:0.4rem 0 1.75rem;
  }

  .lede{max-width:75ch;color:var(--ink-soft);margin:-1rem 0 2rem}

  /* ---------- calendrier ---------- */
  .schedule{list-style:none;margin:0;padding:0;position:relative}
  .schedule::before{
    content:"";
    position:absolute;
    left:calc(2.25rem - var(--rail)/2);
    top:0.7rem;bottom:0.7rem;
    width:var(--rail);
    background:var(--rule);
  }

  .week{
    position:relative;
    display:grid;
    grid-template-columns:4.5rem 1fr;
    gap:0 1.5rem;
    padding:0 0 1.75rem;
  }
  .week:last-child{padding-bottom:0}

  .week-mark{
    position:relative;
    z-index:1;
    grid-column:1;
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--ink-soft);
    text-align:center;
    padding-top:0.15rem;
  }
  .week-dot{
    display:block;
    width:0.7rem;height:0.7rem;
    margin:0.35rem auto 0.5rem;
    border-radius:50%;
    background:var(--paper);
    box-shadow:0 0 0 var(--rail) var(--rule) inset, 0 0 0 4px var(--paper);
  }

  .week-body{
    grid-column:2;
    background:var(--card);
    border:1px solid var(--rule);
    padding:1.15rem 1.3rem;
  }

  .week h3{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.12rem;
    letter-spacing:-0.012em;
    margin:0;
  }
  .week p{margin:0.45rem 0 0;color:var(--ink-soft);max-width:75ch}

  .week-td{
    margin:0.85rem 0 0;
    padding-top:0.7rem;
    border-top:1px solid var(--rule);
    max-width:75ch;
  }
  .week-td b{
    font-family:var(--mono);
    font-weight:500;
    font-size:0.66rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.45;
    display:block;
    margin-bottom:0.2rem;
  }
  .week.is-now .week-td{border-top-color:#C4E0A9}

  .week-links{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
    margin-top:0.95rem;
  }
  .week-links a{
    font-family:var(--mono);
    font-size:0.74rem;
    text-decoration:none;
    padding:0.32rem 0.6rem;
    border:1px solid var(--rule);
    color:var(--ink);
    transition:background 0.14s ease,border-color 0.14s ease;
  }
  .week-links a:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}

  /* séance en cours */
  .week.is-now .week-dot{
    background:var(--now);
    box-shadow:0 0 0 var(--rail) var(--now) inset, 0 0 0 4px var(--paper);
  }
  .week.is-now .week-mark{color:var(--now)}
  .week.is-now .week-body{
    border-color:var(--now);
    background:var(--now-wash);
  }
  .now-tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--now);
    margin-bottom:0.4rem;
  }

  /* épreuve */
  .week.is-exam .week-body{border-color:var(--due);background:var(--due-wash)}
  .week.is-exam .week-dot{
    background:var(--due);
    box-shadow:0 0 0 var(--rail) var(--due) inset, 0 0 0 4px var(--paper);
  }
  .week.is-exam .week-mark{color:var(--due)}
  .exam-tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--due);
    margin-bottom:0.4rem;
  }

  .week.is-past .week-body{opacity:0.62}
  .week.is-past:hover .week-body{opacity:1}


  /* ---------- blocs de texte ---------- */
  .cols{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))}
  .cols h3{font-family:var(--sans);font-weight:600;font-size:1rem;margin:0 0 0.5rem;letter-spacing:-0.01em}
  .cols p{margin:0 0 0.75rem;color:var(--ink-soft)}
  .cols code{font-family:var(--mono);font-size:0.85em;background:var(--card);padding:0.1em 0.35em;border:1px solid var(--rule)}
  .cols a{color:var(--now);text-underline-offset:0.15em}

  footer{
    border-top:1px solid var(--rule);
    padding:2rem 0 3rem;
    font-family:var(--mono);
    font-size:0.74rem;
    color:var(--ink-soft);
  }
  footer a{color:inherit}

  /* ---------- petits écrans ---------- */
  @media (max-width:34rem){
    .schedule::before{left:calc(1.4rem - var(--rail)/2)}
    .week{grid-template-columns:2.8rem 1fr;gap:0 0.9rem}
    .week-mark{font-size:0.65rem}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow" id="course-code">L3 ECO</p>
    <h1 id="course-title">Analyse des données</h1>
    <ul class="facts" id="course-facts"></ul>
  </div>
</header>

<div class="wrap">
  <div class="status" id="status" role="status">
    <p class="status-main" id="status-main">Chargement…</p>
    <p class="status-sub" id="status-sub"></p>
  </div>
</div>

<main>
  <section id="schedule-section">
    <div class="wrap">
      <h2>Schedule</h2>
      <ol class="schedule" id="schedule"></ol>
    </div>
  </section>
  <section>
    <div class="wrap">
      <h2>Practical information</h2>
      <div class="cols" id="practical"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="footer-line"></p>
  </div>
</footer>

<!-- ==========================================================================
     MODIFIER À PARTIR D'ICI.

     Trois blocs commandent toute la page : COURSE, SCHEDULE et PRACTICAL. Pour ajouter une séance, copier un bloc { ... } et en
     changer le contenu. Les dates doivent s'écrire "AAAA-MM-JJ", faute de quoi
     la page ne peut pas déterminer la séance en cours.
     ========================================================================== -->
<script>
/* -------------------------------------------------------------------------
   1. INFORMATIONS SUR LE COURS
   ------------------------------------------------------------------------- */
const REPO = "https://github.com/StefaniaMarcassa/International-Economics---ECOTOPIA";

const SYLLABUS_URL = REPO + "/blob/main/syllabus.md";

const COURSE = {
  code:       "L2 ECOTOPIA",
  title:      "International Economics",
  repoUrl:    REPO,
  facts: [
    { label: "Format",       value: "Session 0 + 6 model sessions · 3h each" },
    { label: "Total",        value: "21 teaching hours" },
    { label: "Contact",    value: "stefania.marcassa@cyu.fr" }
  ]
};

/* -------------------------------------------------------------------------
   2. CALENDRIER
   Un bloc par séance. `date` est le lundi de la semaine concernée.
   `links` porte les supports de COURS. Les documents de TD se renseignent
   plus bas, dans PRACTICAL.

   `exam: true` signale une épreuve : le bloc s'affiche en rouge et n'attend
   ni champ `td` ni supports. Un bloc peut porter `label` au lieu de `week`
   pour afficher autre chose que « Session N » — l'épreuve n'est pas numérotée,
   ce qui garde les numéros de séance alignés sur le syllabus.

   Comment écrire les liens :
     PDF          -> un chemin relatif simple :  "slides/01-intro.pdf"
     .md, .ipynb  -> utiliser REPO + "/blob/main/notebooks/02-data.ipynb"
   ------------------------------------------------------------------------- */
const SCHEDULE = [
  {
    week: 1,
    date: "2026-09-25",
    topic: "The Macro Toolkit",
    summary: "Prerequisite session: national accounting identities (CA = S − I), stocks versus flows and NIIP accumulation, real versus nominal variables and the real exchange rate, discounting and present value, and exchange-rate conventions. The session ends with a graded toolkit check.",
    links: []
  },
  {
    week: 2,
    date: "2026-10-02",
    topic: "Global Imbalances, CA Sustainability & the Intertemporal CA",
    summary: "Chapters 1–3. Balance-of-payments accounting, NIIP and sustainability, the two-period budget constraint and the endowment model, framed around intra-euro imbalances and TARGET2.",
    links: []
  },
  {
    week: 3,
    date: "2026-10-09",
    topic: "CA in a Production Economy & Fiscal Policy",
    summary: "Chapters 5 and 8. Investment, saving and current-account schedules; adjustment to productivity shocks; twin deficits and Ricardian equivalence, with Spanish and Irish convergence booms as applications.",
    links: []
  },
  {
    week: 4,
    date: "2026-10-16",
    topic: "The Real Exchange Rate inside a Monetary Union",
    summary: "Chapters 9–10. PPP and its deviations, the TNT model and sudden stops. With no nominal exchange rate inside the euro area, real adjustment runs through relative prices and wages — the internal-devaluation mechanism.",
    links: []
  },
  {
    week: 5,
    date: "2026-10-23",
    topic: "International Capital Mobility & the Euro",
    summary: "Chapters 11–12. Covered and uncovered interest parity, capital controls and their effects on consumption, investment and welfare. Applications include euro-sovereign spreads, re-fragmentation and capital controls in Cyprus and Greece.",
    links: []
  },
  {
    week: 6,
    date: "2026-11-06",
    topic: "Currency Pegs, Crises & the Euro Capstone",
    summary: "Chapters 14–15. Boom-bust cycles under a peg, balance-of-payments crises, optimum-currency-area theory and the lender-of-last-resort backstop, with the EMS, euro-area sovereign-debt crisis and Greece as case studies.",
    links: []
  },
  {
    label: "Final exam",
    date: "2026-11-13",
    topic: "Final Exam",
    summary: "3 hours. Covers the full model sequence and euro-area policy applications. The graphical and intuitive route is always sufficient; starred algebraic derivations carry bonus credit only.",
    exam: true,
    links: []
  }
];



/* -------------------------------------------------------------------------
   4. INFORMATIONS PRATIQUES
   ------------------------------------------------------------------------- */
const PRACTICAL = [
  {
    heading: "Course materials",
    body: `Slides, data resources and other course materials are available in
      <a href="${REPO}" target="_blank" rel="noopener">the course repository</a>.`
  },
  {
    heading: "Syllabus",
    body: `See the full <a href="${SYLLABUS_URL}" target="_blank" rel="noopener">course syllabus</a>
      for the course description, session plan, readings, resources and assessment details.`
  },
  {
    heading: "Assessment",
    body: `Final exam 100%. In class, without computer, phone or any other electronic device.`
  }
];

/* =========================================================================
   Sous cette ligne se trouve la mécanique qui dessine la page.
   Il ne devrait pas être nécessaire d'y toucher.
   ========================================================================= */
(function () {
  "use strict";

  const DAY = 86400000;
  const now = new Date();

  const fmtDate = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" });

  function el(tag, className, html) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / DAY);
  }

  /* ---- en-tête ---- */
  document.title = COURSE.code + " — " + COURSE.title;
  document.getElementById("course-code").textContent = COURSE.code;
  document.getElementById("course-title").textContent = COURSE.title;

  const factsEl = document.getElementById("course-facts");
  COURSE.facts.forEach(f => {
    factsEl.appendChild(el("li", null,
      "<b>" + escapeHtml(f.label) + "</b>" + escapeHtml(f.value)));
  });

  /* ---- où en est-on dans le semestre ? ---- */
  const weeks = SCHEDULE.map(w => ({ ...w, start: new Date(w.date + "T00:00") }));
  let currentIndex = -1;
  weeks.forEach((w, i) => {
    const next = weeks[i + 1] ? weeks[i + 1].start : new Date(w.start.getTime() + 7 * DAY);
    if (now >= w.start && now < next) currentIndex = i;
  });

  /* ---- calendrier ---- */
  const scheduleEl = document.getElementById("schedule");
  weeks.forEach((w, i) => {
    const li = el("li", "week");
    if (w.exam) li.classList.add("is-exam");
    if (i === currentIndex) li.classList.add("is-now");
    else if (currentIndex > -1 && i < currentIndex) li.classList.add("is-past");
    else if (currentIndex === -1 && now > w.start) li.classList.add("is-past");

    const intitule = w.label ? w.label : "Session " + w.week;
    const mark = el("div", "week-mark",
      escapeHtml(intitule) + "<span class='week-dot'></span>" + fmtDate.format(w.start));
    li.appendChild(mark);

    const body = el("div", "week-body");
    if (w.exam) body.appendChild(el("span", "exam-tag", "Exam"));
    else if (i === currentIndex) body.appendChild(el("span", "now-tag", "This week"));
    body.appendChild(el("h3", null, escapeHtml(w.topic)));
    if (w.summary) body.appendChild(el("p", null, escapeHtml(w.summary)));

    if (w.links && w.links.length) {
      const validLinks = w.links.filter(l => l.href);
      if (validLinks.length) {
        const links = el("div", "week-links");
        validLinks.forEach(l => {
          const a = el("a", null, escapeHtml(l.label));
          a.href = l.href;
          a.target = "_blank";
          a.rel = "noopener";
          links.appendChild(a);
        });
        body.appendChild(links);
      }
    }

    if (w.td) body.appendChild(el("p", "week-td", "<b>Travaux dirigés</b>" + escapeHtml(w.td)));
    li.appendChild(body);
    scheduleEl.appendChild(li);
  });
  /* ---- practical information ---- */
  const practicalEl = document.getElementById("practical");
  PRACTICAL.forEach(p => {
    const div = el("div");
    div.appendChild(el("h3", null, escapeHtml(p.heading)));
    div.appendChild(el("p", null, p.body));
    practicalEl.appendChild(div);
  });

  /* ---- status banner ---- */
  const statusEl = document.getElementById("status");
  const mainEl = document.getElementById("status-main");
  const subEl = document.getElementById("status-sub");

  const prochaineEpreuve = weeks.find(w => w.exam && w.start >= now);

  if (currentIndex > -1) {
    const w = weeks[currentIndex];
    mainEl.textContent = (w.label ? w.label : "Session " + w.week) + " — " + w.topic;
    if (w.exam) {
      statusEl.classList.add("is-exam");
      subEl.textContent = "Exam this week";
    }
  } else if (weeks.length && now < weeks[0].start) {
    statusEl.classList.add("is-pre");
    const d = daysBetween(now, weeks[0].start);
    mainEl.textContent = "The course starts on " + fmtDate.format(weeks[0].start);
    subEl.textContent = d === 1 ? "Tomorrow." : "Dans " + d + " jours.";
  } else {
    statusEl.classList.add("is-pre");
    mainEl.textContent = "The semester has ended.";
  }

  if (prochaineEpreuve && currentIndex > -1 && !weeks[currentIndex].exam) {
    const d = daysBetween(now, prochaineEpreuve.start);
    if (d > 0 && d <= 21) {
      subEl.textContent = "Midterm exam in " + d + " jours";
    }
  }

  /* ---- footer ---- */
  document.getElementById("footer-line").innerHTML =
    escapeHtml(COURSE.code) + " · Materials and syllabus on " +
    "<a href='" + COURSE.repoUrl + "'>GitHub</a> · Last updated " +
    fmtDate.format(new Date(document.lastModified));
})();
</script>
</body>
</html>
